name: S010 Release and Provenance Audit
on:
  pull_request:
  push:
    branches: [main, session/S010-release-audit]
permissions:
  contents: read
jobs:
  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and mathematical schema guards including negatives
        run: |
          for file in *.js tests/*.mjs; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('authoritative/STATE.json','utf8'))"
          node tests/graph.mjs
          node tests/connections.mjs
          node tests/discovery.mjs
          node tests/release-audit.mjs
      - name: Install tested Chromium browser harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Legacy S002–S009 and new S010 HTTP regression matrix
        run: |
          node tests/browser.mjs
          node tests/browser-connections.mjs
          node tests/browser-discovery.mjs
          node tests/browser-release.mjs
