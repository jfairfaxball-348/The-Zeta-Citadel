name: S009 Discovery and Journeys
on:
  pull_request:
  push:
    branches: [main, session/S009-discovery-journeys]
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and all schema checks
        run: |
          for file in *.js tests/*.mjs; do node --check "$file"; done
          node tests/graph.mjs
          node tests/connections.mjs
          node tests/discovery.mjs
          node -e "JSON.parse(require('fs').readFileSync('authoritative/STATE.json','utf8'))"
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: All prior S002–S008 browser regressions
        run: |
          node tests/browser.mjs
          node tests/browser-connections.mjs
      - name: S009 HTTP desktop/mobile search and journeys
        run: node tests/browser-discovery.mjs
