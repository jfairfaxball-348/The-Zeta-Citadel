name: S003 Great Hall laboratory
on:
  pull_request:
  push:
    branches: [main, session/S003-critical-line-lab]
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and graph
        run: |
          node --check atlas.js
          node --check locations.js
          node --check hall.js
          node --check laboratory.js
          node --check app.js
          node --check tests/graph.mjs
          node --check tests/browser.mjs
          node tests/graph.mjs
          node -e "JSON.parse(require('fs').readFileSync('authoritative/STATE.json','utf8'))"
      - name: Set up browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP Chromium desktop, touch mobile and navigation
        run: node tests/browser.mjs
