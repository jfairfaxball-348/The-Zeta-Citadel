name: S007 Outer Territories
on:
  pull_request:
  push:
    branches: [main, session/S007-outer-territories]
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, authority, graph, source and arithmetic
        run: |
          for file in atlas.js locations.js hall.js laboratory.js courtyard.js keep.js dungeon.js outer.js app.js tests/graph.mjs tests/browser.mjs; do node --check "$file"; done
          node tests/graph.mjs
          node -e "JSON.parse(require('fs').readFileSync('authoritative/STATE.json','utf8'))"
      - name: Set up Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP Chromium desktop and touch mobile; all old and new sectors
        run: node tests/browser.mjs
